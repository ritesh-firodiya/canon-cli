name: release

# A push to main (or a merged PR, or a v* tag) releases when package.json holds a
# version that is not on npm yet. Bumping the version is the release; any other
# push runs the checks and stops. One release at a time.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # tag + GitHub release
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Read version
        id: v
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$version" != "$plugin" ]; then
            echo "::error::package.json is $version but .claude-plugin/plugin.json is $plugin — bump both"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json v$version"; exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.v.outputs.publish == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and GitHub release
        if: steps.v.outputs.publish == 'true'
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" && git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
